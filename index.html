<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Slunatics_V1</title>
    <!-- On importe Font Awesome pour avoir les icônes Roblox et Spotify facilement -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #050505; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; margin: 0; }
        
        /* Section des liens au-dessus de la PDP */
        .social-top { margin-bottom: 15px; display: flex; gap: 20px; font-size: 14px; }
        .social-link { color: #ccc; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .social-link:hover { color: #00d4ff; transform: scale(1.1); }
        .fa-spotify { color: #1DB954; } /* Vert Spotify */

        .card { background: #111; padding: 25px; border-radius: 20px; border: 1px solid #333; width: 350px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card img { width: 150px; height: 150px; border-radius: 50%; border: 3px solid #00d4ff; object-fit: cover; background: #222; }
        
        .playlist-box { width: 100%; max-width: 450px; background: #111; border-radius: 15px; border: 1px solid #222; overflow: hidden; }
        
        /* Masquer le téléchargement natif */
        audio { width: 100%; filter: invert(1); padding: 10px; }
        audio::-internal-media-controls-download-button { display:none; }
        audio::-webkit-media-controls-enclosure { overflow:hidden; }
        audio::-webkit-media-controls-panel { width: calc(100% + 30px); }

        #list { list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto; }
        #list li { padding: 12px 20px; border-bottom: 1px solid #222; cursor: pointer; color: #ccc; text-align: left; transition: 0.2s; }
        #list li:hover { background: #1a1a1a; color: #00d4ff; }
        .active { background: #222; color: #00d4ff !important; font-weight: bold; border-left: 4px solid #00d4ff; }
        
        .btn-discord { display: inline-block; margin-top: 15px; background: #5865F2; color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .btn-discord:hover { background: #4752c4; }
    </style>
</head>
<body>

    <!-- Liens Sociaux au-dessus de la carte -->
    <div class="social-top">
        <a href="https://www.roblox.com" target="_blank" class="social-link">
            <i class="fa-solid fa-cube"></i> ROBLOX
        </a>
        <a href="https://open.spotify.com/user/31g5z4642yxicoslpiq5z5coypem?si=98f60ccdd43d4796" target="_blank" class="social-link">
            <i class="fa-brands fa-spotify"></i> SPOTIFY
        </a>
    </div>

    <div class="card">
        <img src="logo.png" alt="Logo">
        <h1 style="color: #00d4ff; margin-top: 15px;">Slunatics_V1</h1>
        <a href="https://discord.gg/GB2TS9g7pG" target="_blank" class="btn-discord">📥 REJOINDRE LE DISCORD</a>
    </div>

    <div class="playlist-box">
        <audio id="player" controls controlsList="nodownload"></audio>
        <ul id="list">
            <li onclick="playMe('1.mp3', this)">01. BMS</li>
            <li onclick="playMe('2.mp3', this)">02. Beuh Magique</li>
            <li onclick="playMe('3.mp3', this)">03. BMW</li>
            <li onclick="playMe('hakayet.mp3', this)">04. Hakayet</li>
            <li onclick="playMe('jtavaisdit.mp3', this)">05. J'tavais dit</li>
            <li onclick="playMe('jcomprendspas.mp3', this)">06. J'comprends pas</li>
            <li onclick="playMe('pocahontas.mp3', this)">07. Pocahontas</li>
            <li onclick="playMe('petunias.mp3', this)">08. Pétunias</li>
            <li onclick="playMe('ruinart.mp3', this)">09. Ruinart</li>
            <li onclick="playMe('ryuk.mp3', this)">10. Ryuk</li>
            <li onclick="playMe('sdnight.mp3', this)">11. SD Night</li>
            <li onclick="playMe('tourdumonde.mp3', this)">12. Tour du monde</li>
            <li onclick="playMe('vanilla.mp3', this)">13. Vanilla</li>
        </ul>
    </div>

    <script>
        const player = document.getElementById('player');

        function playMe(file, el) {
            player.src = "./" + file + "?v=" + Math.random();
            player.play().catch(err => {
                console.error("Erreur de lecture : " + file);
            });

            document.querySelectorAll('li').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
        }

        player.onended = () => {
            const active = document.querySelector('.active');
            if (active && active.nextElementSibling) active.nextElementSibling.click();
        };
    </script>
</body>
</html>
