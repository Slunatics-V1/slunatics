<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Slunatics</title>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        .card { background: #111; padding: 20px; border-radius: 15px; border: 1px solid #00d4ff; display: inline-block; }
        img { width: 150px; height: 150px; border-radius: 50%; margin-bottom: 10px; }
        li { list-style: none; padding: 10px; background: #222; margin: 5px; cursor: pointer; border-radius: 5px; }
        li:hover { background: #00d4ff; color: black; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Si ton fichier s'appelle logo.png sur GitHub, il s'affichera ici -->
        <img src="logo.png" alt="Logo Slunatics">
        <h1>Slunatics_V1</h1>
        <a href="https://discord.gg/GB2TS9g7pG" style="color:#5865F2; text-decoration:none; font-weight:bold;">REJOINDRE DISCORD</a>
    </div>

    <ul style="padding:0; margin-top:20px;">
        <li onclick="play('1.mp3')">01. BMS (Test 1)</li>
        <li onclick="play('2.mp3')">02. BMW (Test 2)</li>
    </ul>

    <audio id="audioPlayer" controls style="margin-top:20px; filter:invert(1);"></audio>

    <script>
        function play(file) {
            const player = document.getElementById('audioPlayer');
            // Le secret : on ajoute un chiffre aléatoire à la fin pour forcer GitHub à ne pas utiliser le cache
            player.src = file + "?v=" + Math.random();
            player.play();
        }
    </script>

</body>
</html>
