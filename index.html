<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Slunatics_V1</title>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; margin: 0; }
        .card { background: #111; padding: 25px; border-radius: 20px; border: 1px solid #333; width: 350px; text-align: center; margin-bottom: 20px; }
        .card img { width: 150px; height: 150px; border-radius: 50%; border: 3px solid #00d4ff; object-fit: cover; }
        .playlist-box { width: 100%; max-width: 450px; background: #111; border-radius: 15px; border: 1px solid #222; overflow: hidden; }
        audio { width: 100%; filter: invert(1); padding: 10px; }
        #list { list-style: none; padding: 0; margin: 0; max-height: 450px; overflow-y: auto; }
        #list li { padding: 12px 20px; border-bottom: 1px solid #222; cursor: pointer; color: #ccc; text-align: left; }
        #list li:hover { background: #1a1a1a; color: #00d4ff; }
        .active { background: #222; color: #00d4ff !important; font-weight: bold; border-left: 4px solid #00d4ff; }
        .btn-discord { display: inline-block; margin-top: 15px; background: #5865F2; color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Lien corrigé avec slunatic -->
        <img src="https://raw.githubusercontent.com/Slunatics-V1/slunatic/main/logo.png" alt="Logo">
        <h1 style="color: #00d4ff;">Slunatics_V1</h1>
        <a href="https://discord.gg/GB2TS9g7pG" target="_blank" class="btn-discord">📥 REJOINDRE LE DISCORD</a>
    </div>

    <div class="playlist-box">
        <audio id="player" controls></audio>
        <ul id="list">
            <!-- Noms exacts de l'image_4e9ba2.png -->
            <li onclick="playMe('1.mp3', this)">01. BMS</li>
            <li onclick="playMe('2.mp3', this)">02. BMW</li>
            <li onclick="playMe('3.mp3', this)">03. Beuh Magique</li>
            <li onclick="playMe('hakayet.mp3', this)">04. Hakayet</li>
            <li onclick="playMe('j\'tavaisdit.mp3', this)">05. J'tavais dit</li>
            <li onclick="playMe('jcomprendspas.mp3', this)">06. J'comprends pas</li>
            <li onclick="playMe('pocahontas.mp3', this)">07. Pocahontas</li>
            <li onclick="playMe('pétunias.mp3', this)">08. Pétunias</li>
            <li onclick="playMe('ruinart.mp3', this)">09. Ruinart</li>
            <li onclick="playMe('ryuk.mp3', this)">10. Ryuk</li>
            <li onclick="playMe('sdnight.mp3', this)">11. SD Night</li>
            <li onclick="playMe('tourdumonde.mp3', this)">12. Tour du monde</li>
            <li onclick="playMe('vanilla.mp3', this)">13. Vanilla</li>
        </ul>
    </div>

    <script>
        const player = document.getElementById('player');
        // L'adresse de base corrigée sans le "que"
        const baseUrl = "https://raw.githubusercontent.com/Slunatics-V1/slunatic/main/";

        function playMe(file, el) {
            player.src = baseUrl + file;
            player.play().catch(err => {
                alert("Erreur sur le fichier : " + file + "\nVérifie qu'il n'y a pas de majuscule oubliée sur GitHub !");
            });

            document.querySelectorAll('li').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
        }

        player.onended = () => {
            const active = document.querySelector('.active');
            if (active && active.nextElementSibling) active.nextElementSibling.click();
        };
    </script>
</body>
</html>
